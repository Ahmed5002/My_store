<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><title>لوحة التحكم</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--tx:#17262b;--mu:#62757a;--ac:#0f766e;--bd:#dbe6e4}
@media(prefers-color-scheme:dark){:root{--bg:#0f1719;--card:#182326;--tx:#eaf3f2;--mu:#93a8ab;--ac:#0f9d94;--bd:#2a3a3d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;padding:env(safe-area-inset-top,0) 12px 40px}
.w{max-width:640px;margin:0 auto}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px}
button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin:6px 0}
.row.off{opacity:.5}
input,textarea,select{width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);margin:4px 0 10px}
input[type=checkbox]{width:auto;margin:0 0 0 8px}
label{font-size:13px;color:var(--mu);display:block}
.ck{display:flex;align-items:center;color:var(--tx);font-size:14px;margin:6px 0}
.ml{max-height:200px;overflow:auto;border:1px solid var(--bd);border-radius:10px;padding:6px 10px;margin-bottom:10px}
small{color:var(--mu)}
</style></head><body><div class="w"><h2>لوحة التحكم</h2><div id="app"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const C=CFG,sb=supabase.createClient(C.url,C.key),$=s=>document.querySelector(s);
const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SV=['sort','ترتيب الظهور (رقم صغير = أول)','num'],VI=['visible','ظاهر في الموقع','bool'];
const T={
 sections:{l:'الأقسام',t:'name',f:[['name','اسم القسم','text'],['parent_id','يتبع قسم (فاضي = قسم رئيسي)','ref:sections'],SV,VI]},
 products:{l:'المنتجات',t:'title',f:[['title','اسم المنتج','text'],['section_id','القسم','ref:sections'],['image_url','صورة المنتج','media:image'],['link','رابط العمولة (https://)','text'],['discount','نص الخصم (مثال: خصم 30%)','text'],['is_offer','يظهر في العروض','bool'],['description','الوصف (سطر لكل نقطة)','area'],['reviews','التعليقات (سطر: الاسم | التقييم 1-5 | التعليق)','area'],SV,VI]},
 collections:{l:'المجموعات',t:'title',f:[['title','اسم المجموعة','text'],['image_url','صورة المجموعة','media:image'],['product_ids','منتجات المجموعة','multi:products'],['link','رابط شراء المجموعة (https://)','text'],['discount','نص الخصم','text'],['description','الوصف (سطر لكل نقطة)','area'],SV,VI]},
 banners:{l:'الإعلانات',t:'title',f:[['title','عنوان (للتنظيم فقط)','text'],['kind','النوع','sel:image=صورة,video=فيديو'],['media_url','الصورة أو الفيديو','media:any'],['link','رابط عند الضغط (اختياري)','text'],['position','مكانه','sel:top=فوق,bottom=تحت'],SV,VI]}
};
let cur='products',all={},ed=null,msg='';
async function loadAll(){for(const t in T){const r=await sb.from(t).select('*').order('sort').order('id');all[t]=r.data||[]}}
function login(){
 $('#app').innerHTML=`<label>الإيميل</label><input id="em" type="email" dir="ltr"><label>كلمة السر</label><input id="pw" type="password" dir="ltr"><button class="pri" id="lg" style="width:100%">دخول</button><p id="er"></p>`;
 $('#lg').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});r.error?$('#er').textContent='بيانات غلط':start()};
}
async function start(){
 const s=await sb.auth.getSession();if(!s.data.session)return login();
 await loadAll();shell();
}
function shell(){
 const a=$('#app');
 if(ed)return form(a);
 a.innerHTML=`<div class="tabs">${Object.keys(T).map(t=>`<button data-t="${t}" class="${t===cur?'on':''}">${T[t].l}</button>`).join('')}<button id="out">خروج</button></div>
 <p><small>${e(msg)}</small></p><button class="pri" id="add" style="width:100%">+ إضافة</button>
 ${all[cur].map(r=>`<div class="row ${r.visible?'':'off'}"><span>${e(r[T[cur].t])}</span><span><button data-v="${r.id}">${r.visible?'👁 إخفاء':'إظهار'}</button> <button data-e="${r.id}">تعديل</button> <button data-d="${r.id}">مسح</button></span></div>`).join('')||'<p><small>لسه مفيش حاجة هنا.</small></p>'}`;
 a.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{cur=b.dataset.t;msg='';shell()});
 $('#out').onclick=async()=>{await sb.auth.signOut();login()};
 $('#add').onclick=()=>{ed={};form(a)};
 a.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{ed=all[cur].find(r=>r.id==b.dataset.e);form(a)});
 a.querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{const r=all[cur].find(x=>x.id==b.dataset.v);await run(sb.from(cur).update({visible:!r.visible}).eq('id',r.id))});
 a.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(!b.dataset.s){b.dataset.s=1;b.textContent='اضغط تاني للتأكيد';return}await run(sb.from(cur).delete().eq('id',b.dataset.d))});
}
async function run(q){const r=await q;msg=r.error?'حصل خطأ: '+r.error.message:'تم الحفظ ✔';await loadAll();ed=null;shell()}
function field([k,l,t],v){
 const[ty,arg]=t.split(':');
 if(ty==='bool')return `<label class="ck"><input type="checkbox" data-k="${k}" ${v===undefined||v?'checked':''}>${l}</label>`;
 let h=`<label>${l}</label>`;
 if(ty==='text')h+=`<input data-k="${k}" value="${e(v)}">`;
 else if(ty==='num')h+=`<input data-k="${k}" type="number" value="${e(v||0)}">`;
 else if(ty==='area')h+=`<textarea data-k="${k}" rows="4">${e(v)}</textarea>`;
 else if(ty==='sel')h+=`<select data-k="${k}">${arg.split(',').map(o=>{const[a,b]=o.split('=');return `<option value="${a}" ${v===a?'selected':''}>${b}</option>`}).join('')}</select>`;
 else if(ty==='ref')h+=`<select data-k="${k}"><option value="">— بدون —</option>${all[arg].filter(r=>r.id!==ed.id).map(r=>`<option value="${r.id}" ${v==r.id?'selected':''}>${e(r[T[arg].t])}</option>`).join('')}</select>`;
 else if(ty==='multi')h+=`<div class="ml" data-k="${k}">${all[arg].map(r=>`<label class="ck"><input type="checkbox" value="${r.id}" ${(v||[]).includes(r.id)?'checked':''}>${e(r[T[arg].t])}</label>`).join('')}</div>`;
 else if(ty==='media')h+=`<input data-k="${k}" value="${e(v)}" dir="ltr" placeholder="https://..."><input type="file" data-up="${k}" accept="${arg==='image'?'image/*':'image/*,video/*'}"><small id="u-${k}"></small>`;
 return h;
}
function form(a){
 a.innerHTML=`<h3>${ed.id?'تعديل':'إضافة'} — ${T[cur].l}</h3>${T[cur].f.map(f=>field(f,ed[f[0]])).join('')}<p id="ms"></p>
 <button class="pri" id="sv" style="width:100%">حفظ</button> <button id="cn" style="width:100%;margin-top:8px">إلغاء</button>`;
 $('#cn').onclick=()=>{ed=null;shell()};
 $('#sv').onclick=()=>{
  const o={};
  T[cur].f.forEach(([k,,t])=>{const el=document.querySelector(`[data-k="${k}"]`),ty=t.split(':')[0];
   o[k]=ty==='bool'?el.checked:ty==='num'?(parseInt(el.value)||0):ty==='ref'?(el.value?+el.value:null):ty==='multi'?[...el.querySelectorAll('input:checked')].map(i=>+i.value):el.value.trim()});
  const first=T[cur].f[0][0];if(!o[first]&&cur!=='banners'){$('#ms').textContent='الاسم مطلوب';return}
  const id=ed.id;
  run(id?sb.from(cur).update(o).eq('id',id):sb.from(cur).insert(o));
 };
}
document.addEventListener('change',async ev=>{
 const k=ev.target.dataset.up;if(!k)return;const f=ev.target.files[0];if(!f)return;
 const m=$('#u-'+k);m.textContent='جاري الرفع...';
 const n=Date.now()+'-'+f.name.replace(/[^\w.]/g,'');
 const r=await sb.storage.from('media').upload(n,f);
 if(r.error){m.textContent='فشل الرفع: '+r.error.message;return}
 document.querySelector(`[data-k="${k}"]`).value=sb.storage.from('media').getPublicUrl(n).data.publicUrl;m.textContent='✔ تم الرفع';
});
/^https:\/\//.test(C.url)?start():$('#app').textContent='حط بيانات Supabase في config.js الأول';
</script></body></html>
