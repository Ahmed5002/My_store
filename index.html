<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المتجر</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--tx:#17262b;--mu:#62757a;--ac:#0f766e;--bd:#dbe6e4}
@media(prefers-color-scheme:dark){:root{--bg:#0f1719;--card:#182326;--tx:#eaf3f2;--mu:#93a8ab;--ac:#0f9d94;--bd:#2a3a3d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{max-width:1000px;margin:0 auto;padding:12px}
header a{color:var(--tx);text-decoration:none;font-weight:700;font-size:20px}
.hero{background:linear-gradient(135deg,#0f766e,#134e4a);color:#fff;border-radius:16px;padding:22px 18px;margin:8px 0}
.hero h1{margin:0 0 4px;font-size:24px}.hero p{margin:0;color:#d5ece9}
.mu{color:var(--mu);font-size:13px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:7px 14px;white-space:nowrap}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.chips button{font-size:13px;padding:4px 12px;border-radius:99px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 2px 8px rgba(15,60,55,.07);overflow:hidden;text-decoration:none;color:var(--tx);display:block}
.card img,.ph{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.ph{display:flex;align-items:center;justify-content:center;font-size:48px;background:var(--bd)}
.ci{padding:10px}.ci h3{font-size:14px;margin:2px 0}
.bd{position:absolute;top:8px;right:8px;background:#dc2626;color:#fff;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px}
.st{color:#e0a020;font-size:14px}
.bn{margin:8px 0;border-radius:14px;overflow:hidden}.bn img,.bn video{width:100%;display:block}
.pd{display:grid;gap:14px;margin-top:8px}
@media(min-width:700px){.pd{grid-template-columns:1fr 1fr}}
.pd img,.pd .ph{border-radius:14px;width:100%}
.buy{display:block;text-align:center;background:var(--ac);color:#fff;text-decoration:none;font-weight:700;font-size:18px;padding:14px;border-radius:12px;margin:14px 0}
.buy.off{opacity:.5}
.rv{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0}
.back{color:var(--ac);text-decoration:none}
footer{color:var(--mu);font-size:12px;text-align:center;padding:24px 0}
</style></head><body>
<div class="w"><header><a href="#home" id="logo"></a></header><main id="app">...</main>
<footer>إفصاح: هذا الموقع يحتوي على روابط عمولة. قد نحصل على عمولة صغيرة إذا اشتريت من خلالها، دون أي تكلفة إضافية عليك.</footer></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const C=window.CFG,sb=supabase.createClient(C.url,C.key),$=s=>document.querySelector(s);
const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TB=['sections','products','collections','banners'];
let D={},view='all';
const ok=u=>/^https:\/\//.test(u||'');
const im=(u,a)=>ok(u)?`<img src="${e(u)}" alt="${e(a)}" loading="lazy">`:'<div class="ph">🛋️</div>';
const stars=n=>'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n));
const rvs=p=>(p.reviews||'').split('\n').map(l=>l.split('|').map(s=>s.trim())).filter(a=>a.length>=3&&a[2]).map(a=>({n:a[0]||'عميل',r:Math.min(5,Math.max(1,+a[1]||5)),t:a.slice(2).join(' | ')}));
const rate=p=>{const r=rvs(p);return r.length?`<div class="st">${stars(r.reduce((a,b)=>a+b.r,0)/r.length)} <span class="mu">(${r.length})</span></div>`:''};
async function load(){
 const r=await Promise.all(TB.map(t=>sb.from(t).select('*').order('sort').order('id')));
 TB.forEach((t,i)=>D[t]=(r[i].data||[]).filter(x=>x.visible));
 const sid=new Set(D.sections.map(s=>s.id));
 D.sections=D.sections.filter(s=>!s.parent_id||sid.has(s.parent_id));
 const sid2=new Set(D.sections.map(s=>s.id));
 D.products=D.products.filter(p=>!p.section_id||sid2.has(p.section_id));
 render();
}
const kids=id=>D.sections.filter(s=>s.parent_id===id);
const ids=id=>[id,...kids(id).flatMap(s=>ids(s.id))];
const root=id=>{let s=D.sections.find(x=>x.id===id);while(s&&s.parent_id&&D.sections.find(x=>x.id===s.parent_id))s=D.sections.find(x=>x.id===s.parent_id);return s};
const card=p=>`<a class="card" href="#p-${p.id}">${im(p.image_url,p.title)}${p.discount?`<span class="bd">${e(p.discount)}</span>`:''}<div class="ci"><h3>${e(p.title)}</h3>${rate(p)}</div></a>`;
const ccard=c=>`<a class="card" href="#c-${c.id}">${im(c.image_url,c.title)}${c.discount?`<span class="bd">${e(c.discount)}</span>`:''}<div class="ci"><h3>📦 ${e(c.title)}</h3><span class="mu">${(c.product_ids||[]).length} منتجات</span></div></a>`;
const bn=pos=>D.banners.filter(b=>b.position===pos&&ok(b.media_url)).map(b=>{
 const m=b.kind==='video'?`<video src="${e(b.media_url)}" autoplay muted loop playsinline></video>`:`<img src="${e(b.media_url)}" alt="${e(b.title)}">`;
 return `<div class="bn">${ok(b.link)?`<a href="${e(b.link)}" target="_blank" rel="sponsored noopener">${m}</a>`:m}</div>`}).join('');
function render(){
 $('#logo').textContent=C.name;document.title=C.name;
 const h=location.hash.slice(1);
 if(h.startsWith('p-')){const p=D.products.find(x=>x.id==h.slice(2));if(p)return prod(p)}
 if(h.startsWith('c-')){const c=D.collections.find(x=>x.id==h.slice(2));if(c)return col(c)}
 home();
}
function home(){
 const sel=view[0]==='s'?+view.slice(1):null,rt=sel?root(sel):null;
 const tops=D.sections.filter(s=>!s.parent_id);
 const tab=(v,l)=>`<button data-v="${v}" class="${view===v||(rt&&v==='s'+rt.id)?'on':''}">${l}</button>`;
 let body;
 if(view==='cols')body=D.collections.map(ccard).join('');
 else{let l=D.products;if(view==='offers')l=l.filter(p=>p.is_offer);else if(sel){const s=new Set(ids(sel));l=l.filter(p=>s.has(p.section_id))}body=l.map(card).join('')}
 const chips=rt&&kids(rt.id).length?`<div class="tabs chips">${tab('s'+rt.id,'الكل')}${kids(rt.id).map(k=>`<button data-v="s${k.id}" class="${view==='s'+k.id?'on':''}">${e(k.name)}</button>`).join('')}</div>`:'';
 $('#app').innerHTML=`${bn('top')}<section class="hero"><h1>${e(C.name)}</h1><p>${e(C.tag)}</p></section>
 <nav class="tabs">${tab('all','الكل')}${D.products.some(p=>p.is_offer)?tab('offers','🔥 العروض'):''}${D.collections.length?tab('cols','📦 المجموعات'):''}${tops.map(s=>tab('s'+s.id,e(s.name))).join('')}</nav>${chips}
 <div class="grid">${body||'<p class="mu">لا توجد عناصر هنا حاليا.</p>'}</div>${bn('bottom')}`;
 document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;home()});
}
const buy=l=>ok(l)?`<a class="buy" href="${e(l)}" target="_blank" rel="sponsored noopener">اضغط هنا — اشترِ من تيمو</a>`:'<span class="buy off">رابط الشراء غير مضاف</span>';
function prod(p){
 const r=rvs(p),s=D.sections.find(x=>x.id===p.section_id);
 $('#app').innerHTML=`<p><a class="back" href="#home">→ رجوع</a></p><div class="pd"><div>${im(p.image_url,p.title)}</div><div>
 <span class="mu">${e(s?s.name:'')}</span><h1 style="margin:2px 0">${e(p.title)}</h1>${p.discount?`<b style="color:#dc2626">${e(p.discount)}</b>`:''}${rate(p)}
 <ul>${(p.description||'').split('\n').filter(Boolean).map(d=>`<li>${e(d)}</li>`).join('')}</ul>${buy(p.link)}</div></div>
 <h2>التعليقات</h2>${r.map(x=>`<div class="rv"><div class="st">${stars(x.r)}</div><b>${e(x.n)}</b><div>${e(x.t)}</div></div>`).join('')||'<p class="mu">لا توجد تعليقات بعد.</p>'}`;
 scrollTo(0,0);
}
function col(c){
 const l=D.products.filter(p=>(c.product_ids||[]).includes(p.id));
 $('#app').innerHTML=`<p><a class="back" href="#home">→ رجوع</a></p><div class="pd"><div>${im(c.image_url,c.title)}</div><div>
 <h1 style="margin:2px 0">📦 ${e(c.title)}</h1>${c.discount?`<b style="color:#dc2626">${e(c.discount)}</b>`:''}
 <ul>${(c.description||'').split('\n').filter(Boolean).map(d=>`<li>${e(d)}</li>`).join('')}</ul>${buy(c.link)}</div></div>
 <h2>منتجات المجموعة</h2><div class="grid">${l.map(card).join('')}</div>`;
 scrollTo(0,0);
}
addEventListener('hashchange',render);
if(!ok(C.url))$('#app').textContent='لسه محتاج تحط بيانات Supabase في config.js';else load().catch(()=>$('#app').textContent='تعذّر تحميل البيانات');
</script></body></html>
